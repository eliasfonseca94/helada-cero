# Perfil de desarrollo local: apunta a la PostgreSQL levantada con
# `docker compose up -d` y habilita la consola interactiva de Swagger-UI.
app:
  cors:
    # Puertos por defecto de `vite` (servidor de desarrollo) y `vite preview`.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

spring:
  datasource:
    # DB_HOST por defecto es "localhost" porque en desarrollo normal
    # (./mvnw spring-boot:run en la máquina del programador) es correcto; el
    # docker-compose.yml de la raíz del repo lo sobreescribe a "db" — el
    # nombre del servicio de PostgreSQL en la red interna de Docker — porque
    # ahí el backend corre en su propio contenedor, no en el host.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:heladacero_db}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:SecureDevPassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true

logging:
  level:
    com.heladacero: DEBUG
