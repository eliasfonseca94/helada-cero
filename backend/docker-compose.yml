services:
  db:
    image: postgres:16-alpine
    container_name: heladacero-postgres-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: heladacero_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: SecureDevPassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d heladacero_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
